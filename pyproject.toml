[project]
name = "network-simulation-generator"
version = "0.1.0"
description = "Network simulation parameter generation scheme"
authors = [
    {name = "Author"}
]
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "pandas>=2.3.3,<3.0.0",
    "numpy>=2.3.5,<3.0.0",
    "scikit-learn>=1.7.2,<2.0.0",

    "matplotlib>=3.10.7,<4.0.0",
    "seaborn>=0.13.2,<0.14.0",
    "scipy>=1.16.3,<2.0.0",
    "torch>=2.9.1,<3.0.0",
    "torchvision>=0.24.1,<0.25.0",
    "torchaudio>=2.9.1,<3.0.0",
    "plotly>=5.24.1,<6.0.0",
    "networkx>=3.4.1,<4.0.0",
    "kaleido>=1.2.0,<2.0.0",
    "markdown>=3.10,<4.0",
    "tslearn>=0.5.3,<0.6.0",
    "h5py>=3.15.1,<4.0.0",
    "umap-learn>=0.5.9.post2,<0.6.0",
    "markdown2>=2.5.4",
]



[project.scripts]
network-simulate = "network_simulation.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "C90"]
ignore = ["E501"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.uv]
index-url = "https://pypi.tuna.tsinghua.edu.cn/simple"
extra-index-url = [
    "https://pypi.tuna.tsinghua.edu.cn/simple"
]

[dependency-groups]
dev = [
    "pytest-cov>=7.0.0",
]
