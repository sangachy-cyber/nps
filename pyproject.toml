[project]
name = "network-simulation-generator"
version = "0.1.0"
description = "Network simulation parameter generation scheme"
authors = [
    {name = "Author"}
]
readme = "README.md"
requires-python = ">=3.9,<3.13"
dependencies = [
    "pandas>=1.5.3,<2.0.0",
    "numpy==1.24.0",
    "scikit-learn>=1.2.2,<2.0.0",

    "matplotlib>=3.7.5,<4.0.0",
    "scipy>=1.10.1,<2.0.0",
    "torch==2.1.0",
    "plotly>=5.18.0,<6.0.0",
    "networkx>=3.1,<4.0.0",
    "kaleido>=1.2.0,<2.0.0",
    "markdown>=3.5,<4.0",
    "tslearn>=0.5.3,<0.6.0",
    "h5py>=3.8.0,<4.0.0",
    "umap-learn>=0.5.3,<0.6.0",
    "markdown2>=2.5.4",
]



[project.scripts]
network-simulate = "network_simulation.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "C90"]
ignore = ["E501"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.uv]
index-url = "https://pypi.tuna.tsinghua.edu.cn/simple"
extra-index-url = [
    "https://pypi.tuna.tsinghua.edu.cn/simple"
]

[dependency-groups]
dev = [
    "pre-commit>=3.3.0,<4.5.0",
    "pytest-cov>=7.0.0",
]
